name: Inspect hosted mathematics
on:
  pull_request:
    paths:
      - '**.md'
      - 'tools/inspect_hosted_render.py'
      - '.github/workflows/hosted-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENDER_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/inspect_hosted_render.py --ref "$RENDER_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-render-${{ env.RENDER_REF }}
          path: build/hosted-render/
          retention-days: 14
          if-no-files-found: warn

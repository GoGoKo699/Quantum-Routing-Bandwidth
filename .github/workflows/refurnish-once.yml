name: Apply authorized repository layout
on:
  push:
    branches: ['refurnish/current-guidance-20261017']
    paths: ['.github/refurnish.py', '.github/workflows/refurnish-once.yml']
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'GoGoKo699/Quantum-Routing-Bandwidth' && github.ref == 'refs/heads/refurnish/current-guidance-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the unchanged baseline and apply the migration
        run: |
          git merge-base --is-ancestor 39ad350c7563f0908034eef21a0024bd6121df13 HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/refurnish.py')
          p.write_text(p.read_text().replace("'HEAD^'", "'39ad350c7563f0908034eef21a0024bd6121df13'"))
          PY
          python .github/refurnish.py
      - run: python -m pip install -r verification/requirements.txt
      - run: python verification/run_all.py
      - name: Record matching executed outputs and verify exact certificates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          old = json.loads(Path('verification/results/scientific-closure.json').read_text())
          fresh = json.loads(Path('build/verification/verify_scientific_closure.json').read_text())
          def exact(rows):
              return [{k:v for k,v in row.items() if isinstance(v,(int,str,bool))} for row in rows]
          assert exact(old['finite_certificates']) == exact(fresh['finite_certificates'])
          shutil.copy2('build/verification/verify_scientific_closure.json','verification/results/scientific-closure.json')
          shutil.copy2('build/verification/summary.json','verification/results/verification.json')
          PY
          python check_repository.py
          python verification/tools/test_structure.py
      - name: Commit only to the authorized working branch
        run: |
          rm .github/refurnish.py
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Organize science, shared learning, references, and verification'
          git push origin HEAD:refs/heads/refurnish/current-guidance-20261017
